# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    grace = 5
    no_fade_in = true
}

background {
    monitor =
	path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current

    # blur_size = 0
    blur_passes = 0
    noise = 0.0117
    contrast = 1.0000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 60
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $color5
    inner_color = $color0
    font_color = $color12
    fade_on_empty = true
    # placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    placeholder_text = 
    hide_input = true
    
    position = 0, 280
    halign = center
    valign = bottom
}

# Date
label {
    monitor =
    # text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    text = cmd[update:18000000] echo "<b> "$(date +'%F')" </b>"
    color = $color12
    font_size = 30
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, -100
    halign = center
    valign = top
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%H:%M:%S")</b>"
    color = rgba(255, 185, 0, .6)
    font_size = 60
    font_family = JetBrains Mono Nerd Font Mono ExtraBold 
    position = 0, -150
    halign = center
    valign = top
}

# User
label {
    monitor =
    text =    $USER
    color = $color12
    font_size = 18
    font_family = Inter Display Medium
    position = 0, 120
    halign = center
    valign = bottom

}

# battery level, every 1 min
label {
    monitor =
    text = cmd[update:60000] echo "$(cat /sys/class/power_supply/BAT1/capacity)%"
    color = $color11
    font_size = 24
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, 70
    # halign = right
    halign = center
    valign = bottom
}

# uptime, every 30 minutes
label {
    monitor =
    text = cmd[update:1800000] echo "$(uptime -p | cut -d , -f 1,2 --output-delimiter '')"
    color = $color12
    font_size = 24
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 0, 30
    # halign = right
    halign = center
    valign = bottom
}

